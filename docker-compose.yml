version: '3.8'

services:
  browserpilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Bound to loopback on purpose. The API has no user accounts — publishing
      # this on 0.0.0.0 hands anyone on your network a browser running under your
      # Gemini key and proxies. To expose it deliberately, set BROWSERPILOT_TOKEN
      # and change this to "8000:8000".
      - "127.0.0.1:8000:8000"
    environment:
      # Required: Add your Google AI API key
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Optional: Proxy configuration
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-[]}
      # Optional but required before exposing the port beyond loopback
      - BROWSERPILOT_TOKEN=${BROWSERPILOT_TOKEN:-}
    volumes:
      # Persist outputs directory
      - ./outputs:/app/outputs
      # Optional: Mount .env file for local development
      - ./.env:/app/.env:ro
    restart: unless-stopped
    # Use SHM size to prevent browser crashes
    shm_size: '2gb'
    # Security options for running browsers
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: browserpilot-network